i membangun keluarga sakinah.",isi:`Kantor Kementerian Agama Kabupaten Tojo Una-Una melalui Seksi Bimbingan Masyarakat Islam (Bimais) melaksanakan kegiatan Bimbingan Perkawinan (Bimwin) Pra Nikah Angkatan II Tahun 2026 di Aula KUA Kecamatan Ampana Kota.

Kegiatan dibuka langsung oleh Kepala Kantor Kemenag Touna, diikuti sebanyak 20 pasang calon pengantin (Catin) dari berbagai desa di wilayah Ampana Kota.

Kepala Seksi Bimais, H. Ahmad Faisal, S.Ag dalam sambutannya menyampaikan pentingnya bekal ilmu pernikahan sebelum memasuki gerbang rumah tangga. "Pernikahan bukan hanya soal akad, tapi komitmen panjang. Bimwin ini untuk menekan angka perceraian dan stunting," ujarnya.

Materi yang disampaikan meliputi: Membangun Keluarga Sakinah, Mawaddah, Warahmah, Psikologi Keluarga, Manajemen Keuangan Keluarga, serta Kesehatan Reproduksi yang disampaikan oleh narasumber dari Dinas Kesehatan dan DP3A.

Peserta tampak antusias mengikuti sesi diskusi. Salah satu peserta, Rina (24), mengaku mendapat banyak wawasan baru. "Sebelumnya saya kira nikah itu sederhana, ternyata butuh persiapan mental dan finansial yang matang," ungkapnya.

Kegiatan ini akan berlanjut hingga Angkatan IV di kecamatan lainnya seperti Tojo, Ulubongka, dan Ampana Tete.`,foto:[],video:null,tanggal:"2026-05-08",penulis:"Humas Bimais Touna",views:342,status:"Publish"},{id:2,slug:"penyuluh-agama-islam-kreatif-dai-kreatif-touna",judul:"Penyuluh Agama Islam Kreatif Touna Gelar Lomba Dai Kreatif Milenial",kategori:"Penyuluh",ringkasan:"Penyuluh Agama Islam KUA se-Kabupaten Tojo Una-Una berkolaborasi menggelar Dai Kreatif di Masjid Agung Ampana.",isi:`Penyuluh Agama Islam se-Kabupaten Tojo Una-Una yang tergabung dalam IPARI (Ikatan Penyuluh Agama Republik Indonesia) Kabupaten Touna sukses menggelar Lomba Dai Kreatif Milenial 2026 di Masjid Agung Ampana, Kamis (07/05).

Kegiatan ini diikuti 35 peserta dari kalangan pelajar SMA/MA dan mahasiswa. Tujuannya adalah untuk mencetak dai-dai milenial yang mampu berdakwah di era digital dengan konten yang moderat dan menyejukkan.

Ketua IPARI Touna, Ust. Zainal Arifin, mengatakan bahwa tantangan dakwah hari ini berbeda. "Anak muda sekarang dakwahnya di TikTok, Instagram, YouTube. Kita harus bekali mereka dengan kemampuan public speaking dan editing konten," jelasnya.

Dewan juri menilai dari aspek materi, retorika, dan kreativitas penyampaian. Juara pertama diraih oleh Ahmad Rizki dari MAN 1 Touna dengan tema Moderasi Beragama di Media Sosial.

Kemenag Touna berharap kegiatan ini menjadi agenda tahunan untuk memperkuat peran penyuluh sebagai garda terdepan Kementerian Agama di masyarakat.`,foto:[],video:{type:"youtube",url:"https://www.youtube.com/watch?v=dQw4w9WgXcQ"},tanggal:"2026-05-07",penulis:"IPARI Touna",views:521,status:"Publish"},{id:3,slug:"kampung-zakat-uekambuno-berdayakan-mustahik",judul:"Kampung Zakat Uekambuno: Dari Mustahik Menjadi Muzaki, Pemberdayaan Ekonomi Berkelanjutan",kategori:"Kampung Zakat",ringkasan:"Program Kampung Zakat di Desa Uekambuno, Kecamatan Ulubongka berhasil mengentaskan 15 KK dari kemiskinan.",isi:`Program unggulan Bimbingan Masyarakat Islam Kemenag Touna, Kampung Zakat di Desa Uekambuno, Kecamatan Ulubongka menunjukkan hasil menggembirakan.

Sejak dicanangkan Januari 2026, program ini fokus pada pemberdayaan ekonomi mustahik melalui bantuan modal usaha, pelatihan budidaya lele dan itik petelur, serta pendampingan pemasaran oleh Penyuluh Agama.

Kasi Bimais melaporkan, dari 25 KK penerima manfaat awal, kini 15 KK telah berhasil meningkatkan pendapatan hingga di atas Rp 2,5 juta per bulan dan bahkan sudah mulai membayar zakat.

"Kita tidak hanya memberi ikan, tapi kail dan cara memancingnya. Alhamdulillah, Ibu Sitti yang dulu penerima BLT, sekarang sudah bisa menyekolahkan anaknya dan beternak 200 ekor itik," ujar Pendamping Kampung Zakat, Ust. Muh. Saleh.

Baznas Kabupaten Touna turut mendukung dengan penyaluran zakat produktif. Ke depan, Kampung Zakat Uekambuno akan dikembangkan sebagai pilot project ekowisata religi berbasis pemberdayaan zakat.

Bupati Touna memberikan apresiasi atas sinergi Kemenag dan Baznas dalam pengentasan kemiskinan di wilayah pesisir dan kepulauan.`,foto:[],video:null,tanggal:"2026-05-06",penulis:"Tim Kampung Zakat",views:412,status:"Publish"},{id:4,slug:"monitoring-evaluasi-kua-tojo-barat",judul:"Kasi Bimais Monitoring KUA Tojo Barat, Pastikan Layanan Nikah Berjalan Prima",kategori:"Kegiatan KUA",ringkasan:"Monitoring dilakukan untuk memastikan pelayanan pencatatan nikah, bimbingan dan penyuluhan berjalan sesuai SOP.",isi:`Kepala Seksi Bimbingan Masyarakat Islam Kantor Kemenag Tojo Una-Una melakukan Monitoring dan Evaluasi (Monev) ke Kantor Urusan Agama (KUA) Kecamatan Tojo Barat, Selasa (06/05).

Monev ini bertujuan untuk memastikan pelayanan publik di KUA berjalan sesuai Standar Operasional Prosedur (SOP), terutama layanan pencatatan nikah, bimbingan manasik haji, dan layanan keagamaan lainnya.

Dalam kunjungannya, Kasi Bimais memeriksa kelengkapan administrasi buku nikah, arsip, serta sarana prasarana KUA. Ia juga berdialog dengan penghulu dan penyuluh tentang kendala di lapangan, seperti akses jaringan di wilayah kepulauan.

"KUA adalah ujung tombak Kemenag. Pelayanan harus cepat, gratis sesuai aturan, dan ramah. Jangan sampai masyarakat mengeluh karena lambat," tegasnya.

Kepala KUA Tojo Barat, H. Idris, S.HI melaporkan bahwa selama triwulan I 2026 telah mencatat 42 peristiwa nikah dan 15 rujuk, serta aktif melakukan bimbingan penyuluh di 12 desa binaan.

Kemenag Touna berkomitmen meningkatkan layanan berbasis digital melalui aplikasi Simkah dan Pusaka Super App agar masyarakat kepulauan tetap terlayani.`,foto:[],video:null,tanggal:"2026-05-06",penulis:"Humas Kemenag",views:189,status:"Publish"},{id:5,slug:"mou-dukcapil-percepat-layanan-nikah",judul:"Kemenag Touna Teken MoU dengan Dukcapil, Percepat Layanan Pencatatan Nikah Terintegrasi",kategori:"Kabar Bimais",ringkasan:"Kerja sama ini memangkas birokrasi, catin langsung dapat buku nikah dan KK KTP baru setelah akad.",isi:`Terobosan layanan kembali dilakukan Kantor Kementerian Agama Kabupaten Tojo Una-Una. Pada Rabu (05/05), Kemenag Touna menandatangani Nota Kesepahaman (MoU) dengan Dinas Kependudukan dan Pencatatan Sipil (Dukcapil) Kabupaten Tojo Una-Una.

MoU ini tentang Integrasi Data Kependudukan dalam Layanan Pencatatan Pernikahan. Dengan integrasi ini, calon pengantin tidak perlu lagi bolak-balik mengurus dokumen.

Kepala Kemenag Touna menjelaskan, setelah akad nikah, data pasangan akan langsung terupdate di Dukcapil dan mereka bisa langsung mendapatkan Kartu Keluarga (KK) baru dan KTP dengan status kawin.

Bantuan diserahkan secara simbolis oleh Kasi Bimais di Masjid Al-Ikhlas Desa Uekambuno. Bantuan meliputi 10 unit sound system wireless, 20 roll karpet masjid, 100 mushaf Al-Qur'an, dan 50 Iqro.

Kepala Seksi Bimais mengatakan bantuan ini berasal dari APBN Ditjen Bimas Islam Tahun Anggaran 2026. Tujuannya untuk meningkatkan kenyamanan ibadah dan syiar Islam di wilayah pesisir.
